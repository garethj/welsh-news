name: Fetch and translate headlines

on:
  schedule:
    # Every 3 hours during UK daytime (UTC times; adjust for BST as needed)
    - cron: '15 6,9,12,15,18,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and translate headlines
        run: node scripts/fetch-and-translate.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update headlines"
          git push
